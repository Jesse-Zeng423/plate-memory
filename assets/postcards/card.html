<!doctype html>
<html lang="$language"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>$title · Plate Memory</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#e6e9df;color:#3b5144;font-family:Georgia,'Songti SC',serif}
.card{max-width:760px;margin:auto;background:#fffcf2;padding:36px 42px 28px;box-shadow:3px 5px 13px #30403218;overflow:hidden;border-radius:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:12px system-ui,sans-serif;color:#71816b}
h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:28px 0 12px;font-weight:normal}
.friends{display:block;width:100%;height:auto;margin:4px auto 14px;max-height:340px;object-fit:contain}
.message{font-size:23px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0 20px}
.names{font-size:14px;color:#71816b;overflow-wrap:anywhere}.dish{font-size:16px;overflow-wrap:anywhere;margin:16px 0 10px}
.app{display:inline-block;margin-top:22px;color:#63765e;text-underline-offset:4px;font:12px system-ui,sans-serif}.url{font:10px/1.4 ui-monospace,monospace;overflow-wrap:anywhere;color:#71816b;margin:5px 0 0}
.receipt{background:#fffef6}.invitation{background:#fff6df}
@media(max-width:540px){body{padding:12px}.card{padding:24px 22px}h1{margin-top:24px}.message{font-size:20px}.friends{margin:0 auto 12px}.names{font-size:13px}}
@page{size:A4;margin:16mm}
@media print{body{padding:0;background:white}.card{box-shadow:none;max-width:none;padding:20px}.friends{max-height:240px;break-inside:avoid}h1{font-size:32px}.message{font-size:17px;line-height:1.5;widows:3;orphans:3}.url{font-size:9px}}
</style></head><body><main class="card $theme">
<div class="top"><span>Plate Memory</span><span>$date</span></div>
<h1>$title</h1>
<img class="friends" src="$illustration" alt="$illustration_label">
<p class="message">$message</p>
<div class="names">$sender → $recipient</div>
$dish$app
</main></body></html>
