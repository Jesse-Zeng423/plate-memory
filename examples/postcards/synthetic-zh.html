<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#dce6dd;color:#183b35;font-family:Georgia,'Songti SC',serif}
.card{position:relative;max-width:900px;margin:auto;background:#fff9dd;border:2px solid #183b35;padding:48px 54px;box-shadow:10px 10px 0 #789488;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid #183b35;padding-bottom:20px;font:16px ui-monospace,monospace}
.stamp{border:2px dashed #476b59;padding:12px 16px;transform:rotate(4deg);line-height:1.5;text-align:center}

.message{font-size:26px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:40px 0 30px}
.trays{width:100%;height:auto;max-height:240px;margin:20px 0}.dish{padding:18px 0;border-top:1px dashed #476b59;border-bottom:1px dashed #476b59;font-size:21px;overflow-wrap:anywhere}
footer{margin-top:32px;font-size:18px;line-height:1.5}.app{display:inline-block;margin-top:24px;color:#183b35;text-decoration-thickness:2px;text-underline-offset:5px;font:16px system-ui,sans-serif;overflow-wrap:anywhere}.url{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;color:#476b59}.hint{font:13px/1.5 system-ui,sans-serif;color:#476b59}
.receipt{background:#fcfcf1;border-style:dashed;box-shadow:6px 6px 0 #8ba48b}.receipt h1{font-family:ui-monospace,monospace;font-size:42px}.receipt .top{border-bottom-style:dashed}
.invitation{background:#fbe4a2}.invitation .stamp{border-radius:50%;padding:20px}.invitation h1{font-style:italic}
@media(max-width:540px){body{padding:16px}.card{padding:26px 23px;box-shadow:5px 5px 0 #789488}.top{font-size:12px}.stamp{padding:8px}h1{margin-top:28px}.message{font-size:21px;margin-top:28px}.names{font-size:17px}.trays{margin:6px 0}footer{font-size:16px}}
@page{size:A4;margin:12mm}
@media print{body{padding:0;background:white}.card{box-shadow:none;border-width:1px;max-width:none;padding:26px;overflow:visible}.top{font-size:12px;padding-bottom:12px}.stamp{padding:8px}h1{font-size:36px;margin:22px 0 18px}.names{font-size:16px}.message{font-size:17px;line-height:1.5;margin:24px 0;widows:3;orphans:3}.trays{max-height:145px;break-inside:avoid}.dish{font-size:16px;padding:12px 0}footer{font-size:14px;margin-top:20px}.app{font-size:13px;margin-top:16px}.url{font-size:10px}.hint{font-size:11px}}

</style></head><body><main class="card invitation">
